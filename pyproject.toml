# The deliverable here is a static Hugging Face Space, not a Python distribution.
# `cone.py` is a vendored copy of ctbench's analyzer, served to the browser via
# Pyodide; tests assert it has not drifted from upstream.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "cone.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PERF", "ISC", "PL"]
# E402: tests must extend sys.path before importing the vendored module.
ignore = ["PLR2004", "PLR0912", "PLR0915", "PLR0913", "E501", "PLC0415", "PERF203", "E402"]
